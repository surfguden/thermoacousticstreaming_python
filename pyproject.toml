[project]
name = "thermo-acoustic-streaming"
version = "0.1.0"
description = "Python conversion scaffold for the LabVIEW thermo-acoustic streaming application"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.11", "Pillow>=10.0", "pyserial>=3.5", "npTDMS>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
