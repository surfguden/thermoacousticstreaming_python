[project]
name = "thermo-acoustic-streaming"
version = "0.1.0"
description = "Hardware drivers for the thermoacoustic laboratory instruments"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "pyserial>=3.5",
    "numpy>=1.24",
    "pythonnet>=3.0",
    "mecom @ git+https://github.com/meerstetter/pyMeCom.git@v1.1",
]

[project.optional-dependencies]
thorlabs-apt-discovery = ["pylablib>=0.5"]
capture-plot = ["matplotlib"]
ui = ["PySide6>=6.8,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
thermo-acoustic-ui = "thermo_acoustic.ui.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The old suite is retired. Prevent root fallback from collecting manual/vendor
# hardware scripts if pytest is invoked before new offline tests are added.
norecursedirs = ["hardware_tests", "dcamsdk4", "qmix_sdk_for_codex", ".git", ".venv", "venv", "env"]
