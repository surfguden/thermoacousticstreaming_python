name: Driver source checks

on:
  pull_request:
  push:

jobs:
  source-checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax without importing hardware code
        run: python -m compileall -q src tools hardware_tests
      - name: Check repository hygiene
        run: python tools/check_repository_hygiene.py
